name: release-lib
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release-lib.yml
      - .github/workflows/build-lib-sums.yml
      - .github/scripts/**
      - configure*
      - src/rust/**
      - src/Makevars*
      - tools/**
      - "!tools/lib-sums.tsv"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LIB_NAME: libprqlr

jobs:
  check-release-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Test checksum metadata generation
        run: Rscript .github/scripts/test-generate-lib-sums.R

  build:
    needs: check-release-scripts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prep Rust
        working-directory: src/rust
        run: |
          LIB_VERSION="$(cargo metadata --format-version=1 --no-deps | jq --raw-output '.packages[0].version')"
          echo "LIB_VERSION=${LIB_VERSION}" >>"$GITHUB_ENV"
          rustup target add ${{ matrix.target }}


      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src/rust -> target"
          shared-key: ${{ matrix.target }}

      - name: prep for musl
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          # TODO: `true` after rspm supports arm linux <https://github.com/r-lib/actions/issues/960>
          use-public-rspm: ${{ runner.os != 'Linux' || runner.arch != 'ARM64' }}
          Ncpus: 2

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: any::pkgbuild

      - name: Set R include directory
        run: echo "R_INCLUDE_DIR=$(Rscript -e 'cat(normalizePath(R.home("include")))')" >> "$GITHUB_ENV"

      - name: build lib
        env:
          NOT_CRAN: "true"
          TARGET: ${{ matrix.target }}
          LIBPRQLR_BUILD: "true"
          PRQLR_PROFILE: release
        run: |
          # make sure savvy is built from source because rust-cache doesn't work well.
          (find ~/.cargo/registry/ src/rust/target -name 'savvy-*' | xargs rm -rf) || true

          LIB_PATH="$(pwd)/src/rust/target/${TARGET}/${PRQLR_PROFILE}/${LIB_NAME}.a"
          ARTIFACT_NAME="${LIB_NAME}-${LIB_VERSION}-${TARGET}.tar.gz"
          Rscript -e 'pkgbuild::compile_dll(debug = FALSE)'

          tar -czf "${ARTIFACT_NAME}" -C "src/rust/target/${TARGET}/${PRQLR_PROFILE}" "${LIB_NAME}.a"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >>"$GITHUB_ENV"

      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libs-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
        r:
          - oldrel-1
          - release
          - devel
        exclude:
          - os: macos-latest
            r: devel
          - os: macos-latest
            r: oldrel-1
        include:
          - os: macos-15-intel
            r: release
          - os: ubuntu-22.04-arm
            r: release

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: prep Rust
        working-directory: src/rust
        run: |
          LIB_VERSION="$(cargo metadata --format-version=1 --no-deps | jq --raw-output '.packages[0].version')"
          echo "LIB_VERSION=${LIB_VERSION}" >>"$GITHUB_ENV"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "LIB_TARGET=x86_64-pc-windows-gnu" >>"$GITHUB_ENV"
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "LIB_TARGET=$(uname -m)-unknown-linux-gnu" >>"$GITHUB_ENV"
          else
            echo "LIB_TARGET=$(rustc -vV | grep host | cut -d' ' -f2)" >>"$GITHUB_ENV"
          fi
          rm "$(rustup which cargo)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libs-${{ env.LIB_TARGET }}
          path: libs

      - name: prep lib
        run: |
          ARTIFACT_NAME="${LIB_NAME}-${LIB_VERSION}-${LIB_TARGET}.tar.gz"
          tar -xzf "libs/${ARTIFACT_NAME}" -C "tools"
          rm -rf "libs"

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}
          # TODO: `true` after rspm supports arm linux <https://github.com/r-lib/actions/issues/960>
          use-public-rspm: ${{ runner.os != 'Linux' || runner.arch != 'ARM64' }}
          Ncpus: "2"

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::pkgload, any::testthat

      - name: R test
        shell: Rscript {0}
        run: |
          pkgload::load_all()
          testthat::test_local()

  release:
    needs:
      - build
      - test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libs-*
          path: libs
          merge-multiple: true

      - name: create checksums
        working-directory: libs
        run: |
          sha256sum * >"../sha256sums.txt"
          md5sum * >"../md5sums.txt"

      - name: Determine release tag
        id: version
        run: |
          version="$(cargo metadata --format-version=1 --no-deps --manifest-path src/rust/Cargo.toml | jq --raw-output '.packages[] | select(.name == "prqlr") | .version')"
          echo "LIB_TAG=lib-v${version}" >>"$GITHUB_ENV"
          echo "tag=lib-v${version}" >>"$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$LIB_TAG" libs/* sha256sums.txt md5sums.txt \
            --target "$GITHUB_SHA" --title "$LIB_TAG" --prerelease \
            --notes "Pre-built Rust libraries for prqlr, built from ${GITHUB_SHA}."

  # Call explicitly: releases created with GITHUB_TOKEN do not trigger release workflows.
  update-lib-sums:
    needs: release
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/build-lib-sums.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
